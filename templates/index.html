<!DOCTYPE html>

<html>
<head>
    <title>Corrosion Detection</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #333;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input {
            margin: 10px;
        }
        button {
            padding: 10px 20px;
            background: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        img {
            margin-top: 20px;
            width: 200px;
            border-radius: 10px;
        }
        .result {
            font-size: 20px;
            margin-top: 15px;
            color: green;
        }
    </style>
</head>

<body>

<h1>Chemical Pipelines Corrosion Detection Model</h1>

<div class="box">


<form method="POST" enctype="multipart/form-data">
    <input type="file" name="image" required>
    <br>
    <button type="submit">Upload & Predict</button>
</form>

{% if image_data %}
    <h3>Uploaded Image</h3>
    <img src="data:image/jpeg;base64,{{ image_data }}">
{% endif %}

{% if result %}
    <div class="result">
        Result: {{ result }}
    </div>
{% endif %}


</div>

</body>
</html>
